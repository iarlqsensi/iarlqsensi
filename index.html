<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VTRLQ - Sensi & Configurações</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f0f0f;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 25px 18px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 30px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    header p {
      color: #aaa;
      font-size: 15px;
    }

    .card {
      background: #191919;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #292929;
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #bbb;
      font-size: 14px;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #101010;
      color: white;
      margin-bottom: 16px;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      display: none;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #292929;
    }

    .result-item span:first-child {
      color: #bbb;
    }

    .result-item span:last-child {
      font-size: 18px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>RLQ SENSI</h1>
      <p>Gerador de Sensibilidade e DPI - VTRLQ</p>
    </header>

    <div class="card">

      <h2>Configuração do Dispositivo</h2>

      <label for="sistema">Sistema Operacional</label>

      <select id="sistema">
        <option value="">Selecione</option>
        <option value="android">Android</option>
        <option value="ios">iOS</option>
      </select>

      <label for="estilo">Estilo de Sensi</label>

      <select id="estilo">
        <option value="">Selecione</option>
        <option value="balanceada">Balanceada</option>
        <option value="capa">Capa</option>
        <option value="precisao">Precisão</option>
        <option value="rush">Rush</option>
      </select>

      <button onclick="gerarSensi()">
        Gerar Configuração
      </button>

    </div>

    <div class="card result" id="resultado">

      <h2>Sensi Gerada para VTRLQ</h2>

      <div class="result-item">
        <span>Geral</span>
        <span>98</span>
      </div>

      <div class="result-item">
        <span>Ponto Vermelho</span>
        <span>95</span>
      </div>

      <div class="result-item">
        <span>Mira 2x</span>
        <span>92</span>
      </div>

      <div class="result-item">
        <span>Mira 4x</span>
        <span>88</span>
      </div>

      <div class="result-item">
        <span>DPI Indicada</span>
        <span>600</span>
      </div>

      <div class="result-item">
        <span>Botão de Atirar</span>
        <span>55%</span>
      </div>

    </div>

    <footer>
      © 2026 RLQ - Todos os direitos reservados.
    </footer>

  </div>

  <script>
    function gerarSensi() {

      const sistema = document.getElementById("sistema").value;
      const estilo = document.getElementById("estilo").value;

      if (!sistema || !estilo) {
        alert("Selecione o sistema operacional e o estilo de sensi.");
        return;
      }

      document.getElementById("resultado").style.display = "block";

      document.getElementById("resultado").scrollIntoView({
        behavior: "smooth"
      });
    }
  </script>

</body>
</html>
