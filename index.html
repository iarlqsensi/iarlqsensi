<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTRLQ - Sensi & Configurações</title>
    <style>
        /* CSS Integrado */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        header span {
            color: #00e5ff; /* Mude para a cor do seu tema */
        }

        header p {
            color: #8a8f9d;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card de Seleção */
        .card {
            background: #151a23;
            border: 1px solid #222938;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #00e5ff; /* Mude para a cor do seu tema */
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #a0a5b5;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            background: #0b0e14;
            border: 1px solid #2a3245;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: #00e5ff;
        }

        /* Botão de Ação */
        .btn-gerar {
            width: 100%;
            padding: 14px;
            background: #00e5ff; /* Mude para a cor do seu tema */
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-gerar:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Resultado */
        .resultado-box {
            display: none;
            background: #151a23;
            border: 1px dashed #00e5ff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .grid-sensi {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .sensi-item {
            background: #0b0e14;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .sensi-item span {
            display: block;
            font-weight: bold;
            color: #00e5ff;
            font-size: 1.1rem;
            margin-top: 4px;
        }

        footer {
            margin-top: auto;
            padding: 20px 0 10px 0;
            color: #555e70;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1><span>RLQ</span> SENSI</h1>
        <p>Gerador de Sensibilidade e DPI - VTRLQ</p>
    </header>

    <div class="container">
        <!-- Form/Painel -->
        <div class="card">
            <h2>Configuração do Dispositivo</h2>
            
            <div class="form-group">
                <label for="sistema">Sistema Operacional</label>
                <select id="sistema">
                    <option value="android">Android</option>
                    <option value="ios">iOS (iPhone)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="estilo">Estilo de Sensi</label>
                <select id="estilo">
                    <option value="alta">Alta (Rápida)</option>
                    <option value="media">Média (Equilibrada)</option>
                    <option value="baixa">Baixa (Puxada Controlada)</option>
                </select>
            </div>

            <button class="btn-gerar" onclick="gerarSensi()">Gerar Configuração</button>
        </div>

        <!-- Painel de Resultados -->
        <div class="resultado-box" id="resultado">
            <h2 style="color: #fff; font-size: 1rem;">Sensi Gerada para VTRLQ</h2>
            <div class="grid-sensi">
                <div class="sensi-item">Geral <span id="val-geral">98</span></div>
                <div class="sensi-item">Ponto Vermelho <span id="val-reddot">95</span></div>
                <div class="sensi-item">Mira 2x <span id="val-2x">92</span></div>
                <div class="sensi-item">Mira 4x <span id="val-4x">88</span></div>
                <div class="sensi-item">DPI Indicada <span id="val-dpi">600</span></div>
                <div class="sensi-item">Botão de Atirar <span id="val-botao">55%</span></div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 RLQ - Todos os direitos reservados.
    </footer>

    <script>
        // Lógica em JavaScript
        function gerarSensi() {
            const estilo = document.getElementById('estilo').value;
            let geral, reddot, m2x, m4x, dpi, botao;

            if (estilo === 'alta') {
                geral = Math.floor(Math.random() * 5) + 95;
                reddot = Math.floor(Math.random() * 5) + 95;
                m2x = Math.floor(Math.random() * 5) + 90;
                m4x = Math.floor(Math.random() * 5) + 90;
                dpi = Math.floor(Math.random() * 100) + 600;
                botao = "50%";
            } else if (estilo === 'media') {
                geral = Math.floor(Math.random() * 10) + 85;
                reddot = Math.floor(Math.random() * 10) + 85;
                m2x = Math.floor(Math.random() * 10) + 80;
                m4x = Math.floor(Math.random() * 10) + 80;
                dpi = Math.floor(Math.random() * 100) + 500;
                botao = "55%";
            } else {
                geral = Math.floor(Math.random() * 10) + 75;
                reddot = Math.floor(Math.random() * 10) + 75;
                m2x = Math.floor(Math.random() * 10) + 70;
                m4x = Math.floor(Math.random() * 10) + 70;
                dpi = Math.floor(Math.random() * 100) + 400;
                botao = "60%";
            }

            document.getElementById('val-geral').innerText = geral;
            document.getElementById('val-reddot').innerText = reddot;
            document.getElementById('val-2x').innerText = m2x;
            document.getElementById('val-4x').innerText = m4x;
            document.getElementById('val-dpi').innerText = dpi;
            document.getElementById('val-botao').innerText = botao;

            document.getElementById('resultado').style.display = 'block';
        }
    </script>
</body>
</html>
